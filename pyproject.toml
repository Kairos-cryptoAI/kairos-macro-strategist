[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-macro-strategist"
version = "0.2.0"
description = "Kairos Layer 4 — strategic capital allocation (xhigh reasoning)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "kairos-core>=0.3,<0.4",
    "kairos-llm>=0.1,<0.2",
    "kairos-persistence>=0.1,<0.2",
    "pydantic>=2.6,<3",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"
# Keep the transitive runtime foundations aligned with the current source set.
override-dependencies = [
    "kairos-core @ git+https://github.com/Kairos-cryptoAI/kairos-core.git@ff3af7592cbd47be985d794d8d9903aaa8e5df07",
    "kairos-persistence @ git+https://github.com/Kairos-cryptoAI/kairos-persistence.git@752c984ca276ccbb7fcbd1b60a6c75d95fe6f108",
]

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "ff3af7592cbd47be985d794d8d9903aaa8e5df07" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "f67ca208d65c430d93dd6e5e242797191b4017f2" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "752c984ca276ccbb7fcbd1b60a6c75d95fe6f108" }

[project.scripts]
kairos-macro-strategist = "kairos_macro.service:main"
kairos-macro-qualify = "kairos_macro.shadow_qualification:main"

[tool.hatch.build]
exclude = [
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv*",
    "/dist",
]

[tool.hatch.build.targets.wheel]
packages = ["kairos_macro"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
