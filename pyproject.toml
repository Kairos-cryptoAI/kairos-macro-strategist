[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-macro-strategist"
version = "0.2.0"
description = "Kairos Layer 4 — strategic capital allocation (xhigh reasoning)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "kairos-core>=0.3,<0.4",
    "kairos-llm>=0.1,<0.2",
    "kairos-persistence>=0.1,<0.2",
    "pydantic>=2.6,<3",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "9c8659545218147ae181cac04d22a68b5a6549ef" }
kairos-llm = { git = "https://github.com/Kairos-cryptoAI/kairos-llm.git", rev = "b6e1d9952fd5f97ad205204ca2ccf27f1b1f56b4" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "34b5214f366338e4b898f2d7bb46b2fcfbf4051e" }

[project.scripts]
kairos-macro-strategist = "kairos_macro.service:main"
kairos-macro-qualify = "kairos_macro.shadow_qualification:main"

[tool.hatch.build]
exclude = [
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv*",
    "/dist",
]

[tool.hatch.build.targets.wheel]
packages = ["kairos_macro"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
